apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: bitnami
spec:
  type: oci
  interval: 1h
  url: oci://registry-1.docker.io/bitnamicharts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgres-16
spec:
  interval: 10m
  releaseName: postgres-16
  chart:
    spec:
      chart: postgresql
      version: "${POSTGRES_CHART_VERSION}"
      sourceRef:
        kind: HelmRepository
        name: bitnami
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: postgres
    global:
      storageClass: "${STORAGE_CLASS}"
      security:
        allowInsecureImages: true
    architecture: standalone
    image:
      registry: docker.io
      repository: bitnamilegacy/postgresql
      tag: 16.6.0-debian-12-r2
      pullPolicy: IfNotPresent
    auth:
      username: postgres
      existingSecret: postgres-superuser
      secretKeys:
        adminPasswordKey: password
    primary:
      persistence:
        enabled: true
        storageClass: "${STORAGE_CLASS}"
        size: ${POSTGRES_STORAGE_SIZE}
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi
