apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cpf-storage
spec:
  interval: 10m
  releaseName: cpf-storage
  chartRef:
    kind: OCIRepository
    name: cpf-${ENVIRONMENT}-cpf-store
    namespace: cozy-fluxcd
  dependsOn:
    - name: nro-service
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    replicaCount: ${REPLICA_COUNT}
    fullnameOverride: cpf-store
    image:
      repository: ${REGISTRY}/cpf-storage
      pullPolicy: ${IMAGE_PULL_POLICY}
    extraEnv:
      - name: SPRING_APPLICATION_JSON
        value: '{"logging":{"level":{"ACCESS":"WARN"}}}'
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi
    config:
      NEO4J_URI: bolt://cpf-neo4j:7687
      STORE_URL: http://cpf-store.${NAMESPACE}.svc.cluster.local:8080/api/v1/
      TRUSTED_PARTY_URL: http://nro-service.${NAMESPACE}.svc.cluster.local:8020/api/v1/
