apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: nro-service
spec:
  interval: 5m
  url: oci://${REGISTRY}/nro-service
  ref:
    semver: ">=0.0.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nro-service
spec:
  interval: 10m
  releaseName: nro-service
  chartRef:
    kind: OCIRepository
    name: nro-service
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    replicaCount: ${REPLICA_COUNT}
    image:
      repository: ${REGISTRY}/nro-service
      pullPolicy: ${IMAGE_PULL_POLICY}
    existingSecret:
      name: nro-db
    certs:
      existingSecret:
        name: nro-certs
    config:
      TP_FQDN: nro-service:8020
