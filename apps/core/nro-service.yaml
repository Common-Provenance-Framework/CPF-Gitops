apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nro-service
spec:
  interval: 10m
  releaseName: nro-service
  chartRef:
    kind: OCIRepository
    name: cpf-${ENVIRONMENT}-nro-service
    namespace: cozy-fluxcd
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    replicaCount: ${REPLICA_COUNT}
    image:
      repository: ${REGISTRY}/nro-service
      pullPolicy: ${IMAGE_PULL_POLICY}
    existingSecret:
      name: nro-db
      keys:
        TP_DB_USER: username
        TP_DB_PASSWORD: password
    certs:
      existingSecret:
        name: nro-certs
    config:
      TP_FQDN: nro-service.${NAMESPACE}.svc.cluster.local:8020
      TP_DB_URL: jdbc:postgresql://postgres:5432/nrodb
