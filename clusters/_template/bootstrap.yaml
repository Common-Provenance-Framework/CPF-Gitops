apiVersion: v1
kind: Namespace
metadata:
  name: ENVIRONMENT_NAMESPACE
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cpf-ENVIRONMENT_NAME-settings
  namespace: cozy-fluxcd
data:
  ENVIRONMENT: ENVIRONMENT_NAME
  REGISTRY: cerit.io/commonprovenanceframework
  IMAGE_PULL_POLICY: Always
  REPLICA_COUNT: "1"
  STORAGE_CLASS: kubevirt
  POSTGRES_CHART_VERSION: 15.5.38
  POSTGRES_STORAGE_SIZE: 2Gi
  NEO4J_CHART_VERSION: 2026.6.0
  NEO4J_STORAGE_SIZE: 2Gi
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cpf-ENVIRONMENT_NAME
  namespace: cozy-fluxcd
spec:
  interval: 2m
  url: oci://cerit.io/commonprovenanceframework/cpf-gitops
  ref:
    tag: latest
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cpf-ENVIRONMENT_NAME-nro-service
  namespace: cozy-fluxcd
spec:
  interval: 5m
  url: oci://cerit.io/commonprovenanceframework/nro-service
  ref:
    semver: ">=0.0.0"
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cpf-ENVIRONMENT_NAME-cpf-store
  namespace: cozy-fluxcd
spec:
  interval: 5m
  url: oci://cerit.io/commonprovenanceframework/cpf-store
  ref:
    semver: ">=0.0.0"
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cpf-ENVIRONMENT_NAME-sync
  namespace: cozy-fluxcd
spec:
  interval: 10m
  path: ./clusters/ENVIRONMENT_NAME
  prune: false
  wait: false
  timeout: 5m
  sourceRef:
    kind: OCIRepository
    name: cpf-ENVIRONMENT_NAME
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cpf-ENVIRONMENT_NAME-credentials
  namespace: cozy-fluxcd
spec:
  interval: 10m
  path: ./credentials
  prune: true
  wait: true
  timeout: 5m
  targetNamespace: ENVIRONMENT_NAMESPACE
  dependsOn:
    - name: cpf-ENVIRONMENT_NAME-sync
  sourceRef:
    kind: OCIRepository
    name: cpf-ENVIRONMENT_NAME
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cpf-ENVIRONMENT_NAME-infrastructure
  namespace: cozy-fluxcd
spec:
  interval: 10m
  path: ./infrastructure/postgres
  prune: true
  wait: true
  timeout: 15m
  targetNamespace: ENVIRONMENT_NAMESPACE
  dependsOn:
    - name: cpf-ENVIRONMENT_NAME-credentials
  sourceRef:
    kind: OCIRepository
    name: cpf-ENVIRONMENT_NAME
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cpf-ENVIRONMENT_NAME-settings
