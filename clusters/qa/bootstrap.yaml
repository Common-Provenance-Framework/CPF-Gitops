apiVersion: v1
kind: Namespace
metadata:
  name: cpf
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cpf-qa-settings
  namespace: cozy-fluxcd
data:
  ENVIRONMENT: qa
  REGISTRY: cerit.io/commonprovenanceframework
  IMAGE_PULL_POLICY: Always
  REPLICA_COUNT: "1"
  STORAGE_CLASS: kubevirt
  POSTGRES_CHART_VERSION: 15.5.38
  POSTGRES_STORAGE_SIZE: 2Gi
  NEO4J_CHART_VERSION: 2026.6.0
  NEO4J_STORAGE_SIZE: 2Gi
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cpf-qa
  namespace: cozy-fluxcd
spec:
  interval: 2m
  url: oci://cerit.io/commonprovenanceframework/cpf-gitops
  ref:
    tag: latest
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cpf-qa-nro-service
  namespace: cozy-fluxcd
spec:
  interval: 5m
  url: oci://cerit.io/commonprovenanceframework/nro-service
  ref:
    semver: ">=0.0.0"
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cpf-qa-cpf-store
  namespace: cozy-fluxcd
spec:
  interval: 5m
  url: oci://cerit.io/commonprovenanceframework/cpf-store
  ref:
    semver: ">=0.0.0"
---
apiVersion: source.extensions.fluxcd.io/v1beta1
kind: ArtifactGenerator
metadata:
  name: cpf-qa-release
  namespace: cozy-fluxcd
spec:
  sources:
    - alias: gitops
      kind: OCIRepository
      name: cpf-qa
    - alias: nro
      kind: OCIRepository
      name: cpf-qa-nro-service
    - alias: store
      kind: OCIRepository
      name: cpf-qa-cpf-store
  artifacts:
    - name: cpf-qa-release
      originRevision: "@gitops"
      copy:
        - from: "@gitops/**"
          to: "@artifact/"
        - from: "@nro/**"
          to: "@artifact/charts/nro-service/"
        - from: "@store/**"
          to: "@artifact/charts/cpf-store/"
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cpf-qa-sync
  namespace: cozy-fluxcd
spec:
  interval: 10m
  path: ./clusters/qa
  prune: false
  wait: false
  timeout: 5m
  sourceRef:
    kind: OCIRepository
    name: cpf-qa
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cpf-qa-credentials
  namespace: cozy-fluxcd
spec:
  interval: 10m
  path: ./credentials
  prune: true
  wait: true
  timeout: 5m
  targetNamespace: cpf
  dependsOn:
    - name: cpf-qa-sync
  sourceRef:
    kind: OCIRepository
    name: cpf-qa
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cpf-qa-infrastructure
  namespace: cozy-fluxcd
spec:
  interval: 10m
  path: ./infrastructure/postgres
  prune: true
  wait: true
  timeout: 15m
  targetNamespace: cpf
  dependsOn:
    - name: cpf-qa-credentials
  sourceRef:
    kind: OCIRepository
    name: cpf-qa
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cpf-qa-settings
