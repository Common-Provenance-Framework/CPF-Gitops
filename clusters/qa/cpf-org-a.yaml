apiVersion: v1
kind: Namespace
metadata:
  name: cpf-org-a
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cpf-qa-org-a-credentials
  namespace: cozy-fluxcd
spec:
  interval: 10m
  path: ./credentials
  prune: true
  wait: true
  timeout: 5m
  targetNamespace: cpf-org-a
  dependsOn:
    - name: cpf-qa-sync
  sourceRef:
    kind: ExternalArtifact
    name: cpf-qa-release
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cpf-qa-org-a-infrastructure
  namespace: cozy-fluxcd
spec:
  interval: 10m
  path: ./infrastructure
  prune: true
  wait: true
  timeout: 15m
  targetNamespace: cpf-org-a
  dependsOn:
    - name: cpf-qa-org-a-credentials
  sourceRef:
    kind: ExternalArtifact
    name: cpf-qa-release
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cpf-qa-settings
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cpf-qa-org-a-core
  namespace: cozy-fluxcd
spec:
  interval: 10m
  path: ./apps/core
  prune: true
  wait: true
  timeout: 15m
  targetNamespace: cpf-org-a
  dependsOn:
    - name: cpf-qa-org-a-infrastructure
  sourceRef:
    kind: ExternalArtifact
    name: cpf-qa-release
  postBuild:
    substitute:
      NAMESPACE: cpf-org-a
    substituteFrom:
      - kind: ConfigMap
        name: cpf-qa-settings
