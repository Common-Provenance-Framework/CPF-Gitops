name: Publish GitOps Artifact

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  HARBOR_REGISTRY: cerit.io
  HARBOR_PROJECT: commonprovenanceframework
  ARTIFACT_NAME: cpf-gitops

jobs:
  validate:
    name: 1. Validate Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flux CLI
        uses: fluxcd/flux2/action@main

      - name: Build Kustomize Overlays
        run: |
          for path in infrastructure apps/core apps/optional; do
            echo "--> $path"
            kubectl kustomize "$path" > /dev/null
          done

      - name: Validate Cluster Entrypoints
        run: |
          for path in clusters/*/bootstrap.yaml; do
            case "$path" in
              clusters/_template/*) continue ;;
            esac
            echo "--> $path"
            kubectl apply --dry-run=client --validate=false -f "$path" > /dev/null
          done

  publish:
    name: 2. Publish to Harbor
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref_name == 'main'
    concurrency:
      group: publish-gitops-artifact
      cancel-in-progress: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flux CLI
        uses: fluxcd/flux2/action@main

      - name: Push GitOps Artifact
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          flux push artifact "oci://$HARBOR_REGISTRY/$HARBOR_PROJECT/$ARTIFACT_NAME:latest" \
            --path=. \
            --ignore-paths=".github/,clusters/_template/,README.md" \
            --source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --revision="main@sha1:$GITHUB_SHA" \
            --creds "$DOCKERHUB_USERNAME:$DOCKERHUB_PASSWORD"
