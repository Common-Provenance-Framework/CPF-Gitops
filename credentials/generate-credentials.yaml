apiVersion: v1
kind: ServiceAccount
metadata:
  name: generate-credentials
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: generate-credentials
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: generate-credentials
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: generate-credentials
subjects:
  - kind: ServiceAccount
    name: generate-credentials
---
apiVersion: batch/v1
kind: Job
metadata:
  name: generate-credentials
  labels:
    kustomize.toolkit.fluxcd.io/substitute: disabled
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: generate-credentials
      restartPolicy: Never
      containers:
        - name: kubectl
          image: docker.io/alpine/k8s:1.35.6
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              random() {
                head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n'
              }

              missing() {
                [ -z "$(kubectl get secret "$1" --ignore-not-found -o name)" ]
              }

              if missing postgres-superuser; then
                kubectl create secret generic postgres-superuser \
                  --from-literal=password="$(random)"
              fi

              if missing nro-db; then
                kubectl create secret generic nro-db \
                  --from-literal=username=nro \
                  --from-literal=password="$(random)" \
                  --from-literal=database=nrodb
              fi

              if missing neo4j; then
                password="$(random)"
                kubectl create secret generic neo4j \
                  --from-literal=NEO4J_AUTH="neo4j/$password" \
                  --from-literal=neo4j-username=neo4j \
                  --from-literal=neo4j-password="$password"
              fi
